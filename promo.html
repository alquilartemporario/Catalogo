  <p class="lead" style="margin:0 auto 32px">${D?(D.ya?"Disponible para ingreso inmediato.":esc(D.txt)+"."):"Está disponible."} Escribinos y coordinamos para que lo conozcas.</p>
  <div class="cta-row" style="justify-content:center"><a class="btn btn-wa" href="${wv}" target="_blank" rel="noopener">${ico}Coordinar visita</a><a class="btn btn-acc" href="${wr}" target="_blank" rel="noopener">Reservarlo</a></div>
  <div><a class="handle" href="https://www.instagram.com/alquilar.temporario/" target="_blank" rel="noopener">@alquilar.temporario</a></div>
  <div style="margin-top:22px"><a class="btn btn-ghost" href="promos.html">🔥 Ver más deptos en promo</a></div>
</div></section>
<footer><div class="wrap">Alquilar Temporario · Departamentos amoblados en Buenos Aires · ${esc(dir)}, ${esc(barrio)}<br>Beneficio sujeto a disponibilidad.</div></footer>`;
  document.querySelectorAll('.wa-v').forEach(a=>a.href=wv);document.querySelectorAll('.wa-r').forEach(a=>a.href=wr);
  document.querySelectorAll('a[href*="wa.me"]').forEach(a=>a.addEventListener('click',()=>{if(window.fbq)fbq('track','Contact',{content_name:dir})}));
  document.querySelectorAll('a[href^="promos.html"]').forEach(a=>a.addEventListener('click',()=>{if(window.fbq)fbq('trackCustom','VolverAPromos',{content_name:dir})}));
  if(window.fbq)fbq('track','ViewContent',{content_name:dir,content_category:'Promo'});
  const lb=$('#lb'),im=lb.querySelector('img');let cur=0;const show=i=>{cur=(i+F.length)%F.length;im.src=F[cur];lb.classList.add('on')};
  document.querySelectorAll('#gal button').forEach(b=>b.onclick=()=>show(+b.dataset.i));
  lb.querySelector('.x').onclick=()=>lb.classList.remove('on');lb.querySelector('.p').onclick=e=>{e.stopPropagation();show(cur-1)};lb.querySelector('.n').onclick=e=>{e.stopPropagation();show(cur+1)};
  lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
  document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
  const els=document.querySelectorAll('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'))}else{const io=new IntersectionObserver(en=>en.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});els.forEach((e,i)=>{e.style.transitionDelay=((i%4)*70)+'ms';io.observe(e)})}
}
const pg=$('#prog');addEventListener('scroll',()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;pg.style.width=(m>0?h.scrollTop/m*100:0)+'%'},{passive:true});
</script>
