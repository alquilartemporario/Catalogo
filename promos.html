<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deptos en promo | Alquilar Temporario</title>
<meta name="description" content="Departamentos amoblados en Buenos Aires con promo: mudate sin complicaciones y sin pagar de más.">
<meta name="theme-color" content="#0c0b10">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#0c0b10;--card:#1a1724;--line:rgba(255,255,255,.09);--mut:#b9b5c6;--acc:#F5B841;--vio:#2b1d47;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 60% at 50% 0%,#2a1d45 0%,var(--bg) 60%) fixed,var(--bg);color:#fff;font-family:Poppins,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(560px,100% - 32px);margin:0 auto;padding:44px 0 60px}
.top{text-align:center;margin-bottom:26px}
.logo{width:84px;height:84px;border-radius:24px;background:var(--acc);color:#16120a;display:grid;place-items:center;font-weight:800;font-size:32px;margin:0 auto 16px;box-shadow:0 18px 40px -12px rgba(245,184,65,.55)}
.top h1{font-size:24px;font-weight:700}
.top .h{color:var(--mut);font-size:14px;margin-top:2px}
.promo{margin:22px 0 6px;background:linear-gradient(135deg,var(--acc),#ffd27a);color:#16120a;border-radius:20px;padding:18px 20px;text-align:center;position:relative;overflow:hidden}
.promo b{display:block;font-size:19px;font-weight:800;line-height:1.25}
.promo span{font-size:14px;font-weight:500}
.count{color:var(--mut);font-size:13px;text-align:center;margin:20px 0 12px}
.list{display:grid;gap:14px}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;transition:transform .2s,border-color .2s;opacity:0;transform:translateY(14px);animation:in .5s ease forwards}
.item:hover{transform:translateY(-2px);border-color:rgba(245,184,65,.5)}
@keyframes in{to{opacity:1;transform:none}}
.ph{flex:none;width:104px;height:104px;border-radius:14px;object-fit:cover;background:#0f0d16}
.tx{flex:1;min-width:0}
.tag{display:inline-block;background:rgba(245,184,65,.15);color:var(--acc);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:5px}
.tx h2{font-size:17px;font-weight:700;line-height:1.2}
.tx .d{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .av{color:#3ddc97;font-size:12px;font-weight:600;margin-top:2px}.tx .v{color:var(--acc);font-weight:700;font-size:14px;margin-top:3px}
.go{flex:none;align-self:stretch;display:flex;align-items:center;justify-content:center;padding:0 14px;border-radius:14px;background:var(--acc);color:#16120a;font-weight:700;font-size:14px;white-space:nowrap}
.empty{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;text-align:center;color:var(--mut)}
.links{display:grid;gap:10px;margin-top:26px}
.lk{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:16px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.lk.wa{background:var(--wa);color:#05290f;border:0}
.lk svg{width:20px;height:20px}
.foot{text-align:center;color:#7d7890;font-size:12px;margin-top:26px}
.sk{height:124px;border-radius:20px;background:linear-gradient(90deg,#1a1724,#241f33,#1a1724);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:400px){.ph{width:84px;height:84px}.go{padding:0 11px;font-size:13px}.tx h2{font-size:15px}}
</style>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1560475887837172');fbq('track','PageView');fbq('track','ViewContent',{content_name:'Deptos en promo'});
</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">AT</div>
    <h1>Alquilar Temporario</h1>
    <div class="h">@alquilar.temporario · Deptos amoblados en Buenos Aires</div>
    <div class="promo"><b>🔥 Deptos en promo</b><span>Mudate sin complicaciones y sin pagar de más</span></div>
  </div>
  <div class="count" id="count">Cargando departamentos…</div>
  <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div class="links">
    <a class="lk wa" id="waGen" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.1-4.7-4-4.8-4.2-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>Consultar por WhatsApp</a>
    <a class="lk" href="https://www.instagram.com/alquilar.temporario/" target="_blank" rel="noopener">📸 Instagram @alquilar.temporario</a>
  </div>
  <div class="foot">Promo sujeta a disponibilidad · Contratos de 3 a 12 meses</div>
</div>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2E7ECUfY-ps4Ok0_1TJxTR1UPoYl-_ZYkGNlvhk9eZWHBslhsWtoCiTaPfCjQJ38kojq9pJBeoGep/pub?output=csv";
const WA="5491168686694";
const PAGINA_DETALLE="promo.html";
document.getElementById('waGen').href="https://wa.me/"+WA+"?text="+encodeURIComponent("¡Hola! Vi los deptos en promo. ¿Me pasás más info?");
document.getElementById('waGen').onclick=function(){if(window.fbq)fbq('track','Contact',{content_name:'Promos general'})};
function cel(r,n){const k=Object.keys(r).find(k=>k.trim().toLowerCase()===n.toLowerCase());return k?String(r[k]||"").trim():""}
function esSi(v){return ["si","sí","yes","true","1","x"].includes(String(v).trim().toLowerCase())}
function foto(r){for(const c of ["Fotos","Fotos2","Fotos3"]){const u=(cel(r,c).match(/https?:\/\/[^\s\])"',]+/)||[])[0];if(u){const m=u.match(/[?&]id=([\w-]+)/)||u.match(/\/d\/([\w-]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w400":u}}return ""}
function tc(v){return String(v||"").toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase())}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function disponible(...txts){const s=txts.join(" \n ");if(/inmediat/i.test(s))return{ya:true,txt:"Ingreso inmediato"};
  const m=s.match(/disp\w*[^\d\n]{0,25}?(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*\d{2,4})?/i)||s.match(/(?:desde|a partir del?)\s+(?:el\s+)?(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/i);
  if(m){const d=+m[1],mo=+m[2];if(d>=1&&d<=31&&mo>=1&&mo<=12)return{ya:false,txt:"Disponible desde el "+d+" de "+MESES[mo-1]}}
  const m2=s.match(/disp\w*[^\n]{0,15}?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)/i);
  if(m2)return{ya:false,txt:"Disponible desde el "+(+m2[1])+" de "+m2[2].toLowerCase()};return null}
function amb(v){const m=String(v).match(/\d+/);return m?(m[0]==="1"?"1 ambiente":m[0]+" ambientes"):"Departamento"}
function slug(v){return String(v||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
Papa.parse(CSV_URL+"&t="+Date.now(),{download:true,header:true,skipEmptyLines:true,complete:function(res){
  const rows=res.data.filter(r=>cel(r,"Dirección")&&esSi(cel(r,"PROMO")));
  const list=document.getElementById('list');list.innerHTML="";
  document.getElementById('count').textContent=rows.length?rows.length+(rows.length===1?" departamento en promo":" departamentos en promo"):"";
  if(!rows.length){list.innerHTML='<div class="empty">Por ahora no hay deptos en promo. Escribinos y te avisamos cuando haya.</div>';return}
  rows.forEach(function(r,i){
    const dir=cel(r,"Dirección"),f=foto(r),a=document.createElement('a');
    a.className="item";a.style.animationDelay=(i*70)+"ms";a.href=PAGINA_DETALLE+"?d="+encodeURIComponent(slug(dir));
    a.innerHTML=(f?'<img class="ph" loading="lazy" src="'+esc(f)+'" alt="'+esc(dir)+'" onerror="this.style.visibility=\'hidden\'">':'<div class="ph"></div>')+
      '<div class="tx"><span class="tag">'+esc(tc(cel(r,"barrio"))||"Promo")+'</span><h2>'+esc(amb(cel(r,"Ambientes")))+'</h2><div class="d">📍 '+esc(dir)+'</div>'+(cel(r,"Valor:")?'<div class="v">'+esc(cel(r,"Valor:"))+'</div>':'')+(function(){const D=disponible(cel(r,"descripcion"),cel(r,"Incluye"),cel(r,"Disponible"));return D?'<div class="av">'+(D.ya?'🔑 ':'📅 ')+esc(D.txt)+'</div>':''})()+'</div><span class="go">Ver más →</span>';
    a.onclick=function(){try{sessionStorage.setItem('promo:'+slug(dir),JSON.stringify(r));sessionStorage.setItem('promoRows',JSON.stringify(rows))}catch(e){}if(window.fbq)fbq('trackCustom','VerPromo',{content_name:dir})};
    list.appendChild(a);
  });
},error:function(){document.getElementById('count').textContent="No se pudieron cargar los departamentos.";document.getElementById('list').innerHTML=""}});
</script>
</body>
</html>
